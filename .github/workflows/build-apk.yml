name: Build RemoveB APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate project (newest RemoveB*.zip in repo root, else source tree)
        id: loc
        run: |
          Z=""; BEST=-1
          for f in RemoveB*.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f")
            t=${t:-0}
            if [ "$t" -gt "$BEST" ]; then BEST=$t; Z="$f"; fi
          done
          if [ -n "$Z" ]; then
            echo "Using zip: $Z (committed $(date -u -d @"$BEST" +%F\ %T) UTC)"
            rm -rf _src && mkdir _src && unzip -oq "$Z" -d _src
            F=$(find _src -name settings.gradle.kts | head -n1)
          else
            echo "No zip found, using source tree"
            F=$(find . -name settings.gradle.kts -not -path './_src/*' | head -n1)
          fi
          [ -n "$F" ] || { echo "settings.gradle.kts not found"; exit 1; }
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        continue-on-error: true
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RemoveB-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/**/*.apk
